# ============================================================
#  WolfISMS-Stack – Betrieb hinter dem NPM-Container (gemeinsames Netz)
#  Kein veröffentlichter App-Port. NPM erreicht die App über ${PROXY_ALIAS}.
#  Lizenz: ./license wird als Verzeichnis gemountet (Daten je Umgebung).
#    - Ohne customer.lic startet die App im Einzelusermodus.
#    - Der Lizenz-Upload im Admin-Bereich legt customer.lic dauerhaft ab.
#    - license-init kopiert license_public.pem beim ersten Start aus dem Image.
# ============================================================
services:

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    networks:
      - default
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Einmaliger Init-Lauf: stellt sicher, dass license_public.pem im
  # Host-Verzeichnis ./license liegt (der Verzeichnis-Mount überdeckt
  # sonst die im Image mitgelieferte Datei).
  license-init:
    image: ${WOLFISMS_IMAGE:-wolfschuster/wolfisms:release}
    entrypoint: ["/bin/sh", "-c",
      "[ -f /host-license/license_public.pem ] || cp /var/www/isms/license/license_public.pem /host-license/"]
    volumes:
      - ./license:/host-license
    restart: "no"

  app:
    image: ${WOLFISMS_IMAGE:-wolfschuster/wolfisms:release}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      license-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_HOST: db
      WOLFISMS_CONTAINER: "1"
    volumes:
      # Lizenzverzeichnis dieser Umgebung (customer.lic + license_public.pem):
      - ./license:/var/www/isms/license:rw
    networks:
      default: {}
      proxy:
        aliases:
          - ${PROXY_ALIAS:?PROXY_ALIAS fehlt in der .env}

  cron:
    image: ${WOLFISMS_IMAGE:-wolfschuster/wolfisms:release}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      license-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DB_HOST: db
      WOLFISMS_CONTAINER: "1"
    volumes:
      - ./license:/var/www/isms/license:ro
    entrypoint: ["/usr/local/bin/wolfisms-cron-entry.sh"]
    command: []
    networks:
      - default
    healthcheck:
      disable: true

networks:
  default:
  proxy:
    external: true
    name: proxy

volumes:
  db_data:
